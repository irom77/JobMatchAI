<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title description">
  <title id="title">Resume tailoring workflow</title>
  <desc id="description">A job posting and candidate profile inform a tailored resume and, when requested, a cover letter. The materials are saved privately in a job folder.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="1" stop-color="#edf5f4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#147d83"/>
      <stop offset="1" stop-color="#245a78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17364b" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#89a8b3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="26" fill="url(#background)"/>
  <circle cx="1125" cy="40" r="120" fill="#dcecea" opacity=".5"/>
  <circle cx="45" cy="345" r="110" fill="#dfeaf2" opacity=".55"/>

  <text x="54" y="58" fill="#52707d" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">A PRIVATE, JOB-SPECIFIC WORKFLOW</text>
  <text x="54" y="91" fill="#183548" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Turn a role into a focused application</text>

  <g filter="url(#shadow)">
    <rect x="54" y="132" width="222" height="112" rx="16" fill="#fff"/>
    <rect x="54" y="132" width="5" height="112" rx="2.5" fill="#80aeb7"/>
    <circle cx="84" cy="166" r="14" fill="#e7f1f2"/>
    <path d="M78 162h12M78 166h12M78 170h8" stroke="#397b83" stroke-width="1.6" stroke-linecap="round"/>
    <text x="76" y="203" fill="#183548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Job posting</text>
    <text x="76" y="225" fill="#66808a" font-family="Arial, Helvetica, sans-serif" font-size="12">Role and requirements</text>

    <rect x="54" y="264" width="222" height="78" rx="16" fill="#fff"/>
    <rect x="54" y="264" width="5" height="78" rx="2.5" fill="#9babc8"/>
    <circle cx="84" cy="296" r="14" fill="#edf0f7"/>
    <path d="M84 289a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm-7 14c1.6-4.2 12.4-4.2 14 0" fill="none" stroke="#63799f" stroke-width="1.6" stroke-linecap="round"/>
    <text x="108" y="300" fill="#183548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Candidate profile</text>
    <text x="108" y="320" fill="#66808a" font-family="Arial, Helvetica, sans-serif" font-size="12">Experience and skills</text>

    <rect x="375" y="188" width="210" height="112" rx="18" fill="#fff"/>
    <rect x="375" y="188" width="210" height="6" rx="3" fill="url(#accent)"/>
    <circle cx="414" cy="229" r="17" fill="#e7f2f1"/>
    <path d="m406 229 5 5 11-12" fill="none" stroke="#28777d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="402" y="270" fill="#183548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Relevant experience</text>
    <text x="402" y="289" fill="#66808a" font-family="Arial, Helvetica, sans-serif" font-size="12">Matched to role needs</text>

    <rect x="684" y="132" width="220" height="112" rx="16" fill="#fff"/>
    <rect x="684" y="132" width="5" height="112" rx="2.5" fill="#55a3a0"/>
    <circle cx="715" cy="166" r="14" fill="#e8f4f0"/>
    <path d="M710 158h8l4 4v12h-12zM718 158v5h4M713 168h6M713 172h6" fill="none" stroke="#398078" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="708" y="203" fill="#183548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Tailored resume</text>
    <text x="708" y="225" fill="#66808a" font-family="Arial, Helvetica, sans-serif" font-size="12">Markdown · TXT · DOCX · PDF</text>

    <rect x="684" y="264" width="220" height="78" rx="16" fill="#fff"/>
    <rect x="684" y="264" width="5" height="78" rx="2.5" fill="#d2a76b"/>
    <circle cx="715" cy="296" r="14" fill="#f8f0e5"/>
    <path d="M709 290h12v12h-12zM712 294h6M712 297h6" fill="none" stroke="#9b784b" stroke-width="1.4" stroke-linecap="round"/>
    <text x="739" y="300" fill="#183548" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Cover letter</text>
    <text x="739" y="320" fill="#66808a" font-family="Arial, Helvetica, sans-serif" font-size="12">Optional, when requested</text>

    <rect x="1000" y="188" width="150" height="112" rx="18" fill="#183f53"/>
    <path d="M1068 215v22m-8-8 8 8 8-8M1054 244h28" fill="none" stroke="#a8ded2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1022" y="270" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Saved privately</text>
    <text x="1022" y="289" fill="#bfd3d8" font-family="Arial, Helvetica, sans-serif" font-size="11">In a per-job folder</text>
  </g>

  <path d="M276 188h40v55h38" fill="none" stroke="#89a8b3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M276 303h40v-58h38" fill="none" stroke="#89a8b3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M585 244h48v-56h39" fill="none" stroke="#89a8b3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M633 244v59h51" fill="none" stroke="#89a8b3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M904 188h44v56h52" fill="none" stroke="#89a8b3" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M904 303h44v-59h52" fill="none" stroke="#89a8b3" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
